name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        default: "v0.2.0-rc.3"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make

      - name: Build and test the static runtime
        shell: msys2 {0}
        run: |
          mingw32-make release
          ./bin/pilang.exe help
          if objdump -p bin/pilang.exe | grep -qi 'DLL Name:.*SDL'; then
            echo "The Windows runtime still depends on an SDL DLL."
            exit 1
          fi

      - name: Build and test a standalone package
        shell: msys2 {0}
        run: |
          (cd test/package && ../../bin/pilang.exe pack target:win)
          mkdir -p dist/pack-test
          cp test/package/test.exe dist/pack-test/
          (cd dist/pack-test && SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test.exe) | tee dist/pack-test/output.txt
          grep -qx 'packaged application' dist/pack-test/output.txt

      - name: Assemble the Windows runtime
        shell: msys2 {0}
        run: |
          mkdir -p dist/Pilang/bin
          cp bin/pilang.exe dist/Pilang/bin/
          cp -r resources dist/Pilang/
          cp -r samples test dist/Pilang/
          cp README.md LICENSE dist/Pilang/
          printf '@echo off\r\ncd /d "%%~dp0"\r\n"%%~dp0bin\\pilang.exe" %%*\r\n' > dist/Pilang/Pilang.cmd
          (cd dist/Pilang && ./bin/pilang.exe help)
          (cd dist && zip -r pilang-windows-x64.zip Pilang)

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pilang-windows-x64
          path: dist/pilang-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber --repo "$REPOSITORY"
            exit 0
          fi

          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" dist/*/* --generate-notes $prerelease --repo "$REPOSITORY"
