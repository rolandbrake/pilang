name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        default: "v0.2.0-rc.1"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-22.04
          - name: macos-arm64
            runner: macos-14
          - name: macos-x64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_mixer

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make release
          ./bin/pilang.exe help
          mkdir -p dist/pilang-windows-x64
          cp bin/pilang.exe dist/pilang-windows-x64/
          cp /ucrt64/bin/*.dll dist/pilang-windows-x64/
          (cd dist && zip -r pilang-windows-x64.zip pilang-windows-x64)

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Build Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make release
          ./bin/pilang help
          mkdir -p dist/pilang-linux-x64/bin dist/pilang-linux-x64/lib
          cp bin/pilang dist/pilang-linux-x64/bin/
          ldd bin/pilang | awk '/=> \// {print $3}' | while read -r library; do
            case "$library" in
              /lib*/libc.so.*|/lib*/libm.so.*|/lib*/libpthread.so.*|/lib*/libdl.so.*|/lib*/ld-linux*) ;;
              *) cp -L "$library" dist/pilang-linux-x64/lib/ ;;
            esac
          done
          printf '%s\n' '#!/usr/bin/env sh' \
            'root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$root/bin/pilang" "$@"' > dist/pilang-linux-x64/pilang
          chmod +x dist/pilang-linux-x64/pilang
          tar -C dist -czf dist/pilang-linux-x64.tar.gz pilang-linux-x64

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_image sdl2_ttf sdl2_mixer dylibbundler

      - name: Build macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          make release
          mkdir -p dist/Pilang.app/Contents/MacOS dist/Pilang.app/Contents/Frameworks
          cp bin/pilang dist/Pilang.app/Contents/MacOS/
          dylibbundler -od -b -x dist/Pilang.app/Contents/MacOS/pilang \
            -d dist/Pilang.app/Contents/Frameworks
          cat > dist/Pilang.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>pilang</string>
            <key>CFBundleIdentifier</key><string>net.pilang.runtime</string>
            <key>CFBundleName</key><string>Pilang</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF
          dist/Pilang.app/Contents/MacOS/pilang help
          tar -C dist -czf dist/pilang-${{ matrix.name }}.tar.gz Pilang.app

      - name: Upload release archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pilang-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload non-Windows release archive
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pilang-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*/* --clobber
            exit 0
          fi

          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" dist/*/* --generate-notes $prerelease
