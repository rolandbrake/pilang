name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        default: "v0.2.0-rc.1"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make

      - name: Build and test the static runtime
        shell: msys2 {0}
        run: |
          mingw32-make release
          ./bin/pilang.exe help
          if objdump -p bin/pilang.exe | grep -qi 'DLL Name:.*SDL'; then
            echo "The Windows runtime still depends on an SDL DLL."
            exit 1
          fi

      - name: Build and test a standalone package
        shell: msys2 {0}
        run: |
          (cd test/package && ../../bin/pilang.exe pack target:win)
          mkdir -p dist/pack-test
          cp test/package/test.exe dist/pack-test/
          (cd dist/pack-test && SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test.exe) | tee dist/pack-test/output.txt
          grep -qx 'packaged application' dist/pack-test/output.txt

      - name: Assemble the Windows runtime
        shell: pwsh
        run: |
          .\tools\release.ps1 $env:GITHUB_REF_NAME -SkipBuild

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pilang-windows-x64
          path: release/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Build and test the static runtime
        run: |
          make release
          ./bin/pilang help
          if ldd bin/pilang 2>&1 | grep -q '=>'; then
            echo "The Linux runtime has shared-library dependencies."
            ldd bin/pilang
            exit 1
          fi

      - name: Assemble the Linux runtime
        run: ./tools/release.sh "$GITHUB_REF_NAME" --skip-build

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pilang-linux-x64
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          mapfile -t archives < <(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release ZIP was downloaded."
            exit 1
          fi

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${archives[@]}" --clobber --repo "$REPOSITORY"
            exit 0
          fi

          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" "${archives[@]}" --generate-notes $prerelease --repo "$REPOSITORY"
